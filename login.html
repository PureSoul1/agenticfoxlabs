<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Agentic Fox Labs</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/app.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --surface-color: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --brand-color: #334155;
      --brand-hover: #0f172a;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
    }
    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      background: #fdfdfd;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--brand-color);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--brand-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background: var(--brand-hover);
    }
    .btn-oauth {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-oauth:hover {
      background: #f1f5f9;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }
    .toggle-text {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .toggle-text a {
      color: var(--brand-color);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-title">Agentic Fox Labs</div>
    <div class="brand-subtitle">Sign in to manage your enterprise ERP</div>

    <button class="btn btn-oauth" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.61c-.29 1.53-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.65-5.17 3.65-8.58z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.11 0-5.74-2.11-6.68-4.96H1.21v3.15C3.18 21.88 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.32 14.24A7.16 7.16 0 0 1 5 12c0-.79.13-1.57.32-2.34V6.51H1.21A11.94 11.94 0 0 0 0 12c0 1.92.45 3.74 1.21 5.39l4.11-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.18 2.12 1.21 6.51l4.11 3.15c.94-2.85 3.57-4.96 6.68-4.96z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or use email</div>

    <form id="loginForm" onsubmit="handleEmailLogin(event)">
      <div class="form-group">
        <label for="email">Business Email</label>
        <input type="email" id="email" required placeholder="name@company.com">
      </div>
      <div class="form-group" id="passwordGroup">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <div class="toggle-text">
      <a href="#" onclick="toggleMagicLink(event)" id="magicLinkToggle">Use Magic Link instead</a>
    </div>
    
    <div class="toggle-text" style="margin-top: 8px;">
      Don't have an account? <a href="#" onclick="toggleMode(event)" id="modeToggle">Sign Up</a>
    </div>
  </div>

  <script>
    let isSignUp = false;
    let isMagicLink = false;

    function toggleMode(e) {
      e.preventDefault();
      isSignUp = !isSignUp;
      document.querySelector('.brand-subtitle').textContent = isSignUp ? 'Create your enterprise account' : 'Sign in to manage your enterprise ERP';
      document.getElementById('submitBtn').textContent = isSignUp ? 'Sign Up' : (isMagicLink ? 'Send Magic Link' : 'Sign In');
      document.getElementById('modeToggle').textContent = isSignUp ? 'Sign In' : 'Sign Up';
      document.getElementById('passwordGroup').style.display = (isMagicLink) ? 'none' : 'block';
    }

    function toggleMagicLink(e) {
      e.preventDefault();
      isMagicLink = !isMagicLink;
      const passGroup = document.getElementById('passwordGroup');
      if (isMagicLink) {
        passGroup.style.display = 'none';
        document.getElementById('password').removeAttribute('required');
        document.getElementById('submitBtn').textContent = 'Send Magic Link';
        document.getElementById('magicLinkToggle').textContent = 'Use password instead';
      } else {
        passGroup.style.display = 'block';
        document.getElementById('password').setAttribute('required', 'required');
        document.getElementById('submitBtn').textContent = isSignUp ? 'Sign Up' : 'Sign In';
        document.getElementById('magicLinkToggle').textContent = 'Use Magic Link instead';
      }
    }

    async function handleEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        if (isMagicLink) {
          const { error } = await sbClient.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: window.location.origin + '/portal.html' }
          });
          if (error) throw error;
          alert('Magic link sent! Check your inbox.');
        } else if (isSignUp) {
          const { data, error } = await sbClient.auth.signUp({ email, password });
          if (error) throw error;
          alert('Registration successful! Please verify your email or log in.');
        } else {
          const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = '/portal.html';
        }
      } catch (err) {
        alert(err.message || 'Authentication failed');
      } finally {
        btn.disabled = false;
        btn.textContent = isSignUp ? 'Sign Up' : (isMagicLink ? 'Send Magic Link' : 'Sign In');
      }
    }

    async function loginWithGoogle() {
      try {
        const { error } = await sbClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/portal.html' }
        });
        if (error) throw error;
      } catch (err) {
        alert(err.message || 'Google login failed');
      }
    }
  </script>
</body>
</html>
