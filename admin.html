</div>

<div class="container" id="adminContent" role="main">
  <h3 style="margin-bottom: 20px;">Recent Demo Requests</h3>

  <table aria-label="Demo requests table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Name</th>
        <th>Email</th>
        <th>Interest</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="leadsTableBody">
      <tr>
        <td colspan="6" style="text-align: center;">Loading data...</td>
      </tr>
    </tbody>
  </table>
</div>

<script src="./js/app.js" defer></script>
<script>
  // Fix for checkAuth missing if app.js fails to load
  if (typeof checkAuth === 'undefined') {
    window.checkAuth = async function() { return null; };
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const session = await checkAuth();
    if (!session || (session.user.email !== 'admin@agenticfoxlabs.com' && session.user.email !== 'your.email@gmail.com')) {
      document.getElementById('adminContent').innerHTML = '<div class="unauthorized"><h2>🚫 Unauthorized Access</h2><p>You do not have permission to view this page.</p><a href="./index.html">Return to Home</a></div>';
      return;
    }

    fetchLeads();
  });

  async function fetchLeads() {
    // TODO: Replace with actual Worker API call later
    const fakeData = [
      { date: '2026-05-21', name: 'Rahul Sharma', email: 'rahul@school.com', interest: 'School ERP', status: 'new' },
      { date: '2026-05-20', name: 'Dr. Verma', email: 'verma@clinic.in', interest: 'Clinic ERP', status: 'contacted' }
    ];

    const tbody = document.getElementById('leadsTableBody');
    tbody.innerHTML = '';

    fakeData.forEach(lead => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + lead.date + '</td>' +
        '<td>' + lead.name + '</td>' +
        '<td>' + lead.email + '</td>' +
        '<td>' + lead.interest + '</td>' +
        '<td><span class="status-' + lead.status + '">' + lead.status.toUpperCase() + '</span></td>' +
        '<td><button style="cursor:pointer; padding:4px 8px; border:1px solid #cbd5e1; background:#fff; border-radius:4px; font-family:inherit;">Update</button></td>';
      tbody.appendChild(tr);
    });
  }
</script>
