<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(249,115,22,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(249,115,22,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .error-container {
    position: relative;
    z-index: 2;
    max-width: 560px;
  }

  /* Glitch effect on 404 */
  .glitch {
    font-size: 120px;
    font-weight: 800;
    line-height: 1;
    color: #fff;
    position: relative;
    text-shadow: 0 0 20px rgba(249,115,22,0.3);
    animation: glitchText 3s infinite;
  }
  .glitch::before,
  .glitch::after {
    content: '404';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;
  }
  .glitch::before {
    color: #f97316;
    z-index: -1;
    animation: glitch1 2s infinite;
  }
  .glitch::after {
    color: #3b82f6;
    z-index: -2;
    animation: glitch2 2.5s infinite;
  }

  @keyframes glitch1 {
    0%, 100% { clip-path: inset(0 0 95% 0); transform: translate(0); }
    5% { clip-path: inset(20% 0 60% 0); transform: translate(-4px, 2px); }
    10% { clip-path: inset(50% 0 30% 0); transform: translate(4px, -2px); }
    15% { clip-path: inset(0 0 95% 0); transform: translate(0); }
    50% { clip-path: inset(0 0 95% 0); transform: translate(0); }
    55% { clip-path: inset(30% 0 50% 0); transform: translate(-3px, 1px); }
    60% { clip-path: inset(0 0 95% 0); transform: translate(0); }
  }
  @keyframes glitch2 {
    0%, 100% { clip-path: inset(95% 0 0 0); transform: translate(0); }
    8% { clip-path: inset(60% 0 20% 0); transform: translate(4px, -2px); }
    12% { clip-path: inset(30% 0 40% 0); transform: translate(-4px, 2px); }
    16% { clip-path: inset(95% 0 0 0); transform: translate(0); }
    45% { clip-path: inset(95% 0 0 0); transform: translate(0); }
    52% { clip-path: inset(40% 0 30% 0); transform: translate(3px, -1px); }
    56% { clip-path: inset(95% 0 0 0); transform: translate(0); }
  }
  @keyframes glitchText {
    0%, 100% { text-shadow: 0 0 20px rgba(249,115,22,0.3); }
    5% { text-shadow: -3px 0 #f97316, 3px 0 #3b82f6; }
    10% { text-shadow: 0 0 20px rgba(249,115,22,0.3); }
    50% { text-shadow: 0 0 20px rgba(249,115,22,0.3); }
    55% { text-shadow: 2px 0 #f97316, -2px 0 #3b82f6; }
    60% { text-shadow: 0 0 20px rgba(249,115,22,0.3); }
  }

  .fox-emoji {
    font-size: 48px;
    margin-bottom: 24px;
    display: inline-block;
    animation: foxBounce 2s ease-in-out infinite;
  }
  @keyframes foxBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .error-title {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 12px;
  }
  .error-desc {
    font-size: 16px;

    line-height: 1.6;
    margin-bottom: 36px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
  .error-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn-primary {
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 14px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 4px 16px rgba(249,115,22,0.3);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(249,115,22,0.4);
  }
  .btn-secondary {
    border: 2px solid #475569;
    color: #e2e8f0;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 14px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: border-color .2s, color .2s;
  }
  .btn-secondary:hover {
    border-color: #f97316;
    color: #f97316;
  }

  .help-text {
    font-size: 13px;

    margin-top: 32px;

  .help-text a {
    color: #f97316;
    text-decoration: none;
    font-weight: 600;
  }
  .help-text a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .glitch { font-size: 80px; }
    .glitch::before, .glitch::after { font-size: 80px; }
  }
